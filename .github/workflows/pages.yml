# Publishes docs-site/ (home, privacy policy, terms — needed for the YouTube API audit) to GitHub Pages.
# One-time: repo Settings → Pages → Source: "GitHub Actions". URL: https://hamsidhi.github.io/clipforge/
name: Publish docs-site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["docs-site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs-site
      - id: deployment
        uses: actions/deploy-pages@v4
