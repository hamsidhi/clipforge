# ClipForge configuration. Every value here can also be changed from the web app (Settings page).
# Secrets (GEMINI_API_KEY, GROQ_API_KEY) live in .env, never here.

clips:
  count: 20          # how many clips to output (clamped to min_count..max_count)
  min_count: 15
  max_count: 25
  min_sec: 20.0
  max_sec: 59.0
  max_overlap: 0.3   # drop a candidate overlapping a better one by more than this fraction

whisper:
  model: auto          # auto -> large-v3 on CUDA, large-v3-turbo on CPU. Or: small, medium, large-v3, large-v3-turbo
  language: hi         # hi, en, or auto
  compute_type: auto   # auto -> float16 on CUDA, int8 on CPU
  vad: true
  beam_size: auto      # auto -> 5 on GPU, 1 on CPU

transcript:
  source: auto         # auto (pasted > YouTube captions > Whisper) | pasted | youtube | whisper
  youtube_languages: [hi, en]  # caption languages tried first (then any)
  clip_pad_sec: 1.5    # pasted / caption transcripts: Whisper runs only on each chosen clip ± this
  max_duration_gap: 0.1  # warn when a pasted transcript ends this far (fraction) from the video's end

llm:
  provider: ollama     # ollama | gemini | groq | mock
  model: auto          # auto -> best installed Ollama model / provider default
  temperature: 0.3
  window_min: 8.0
  overlap_min: 1.0
  max_retries: 3
  max_candidates_per_window: 6
  ollama_url: http://127.0.0.1:11434
  timeout_sec: 600
  max_tokens: 2048     # cap per LLM reply (stops runaway generations on slow CPUs)
  num_thread: 0        # Ollama CPU threads; 0 = Ollama's default (one per physical core — measured fastest)
  seed: null           # Ollama sampling seed: a number makes re-runs reproducible (null = random)
  keep_alive: 30m      # Ollama unloads the model this long after the last request (server: 2m frees RAM for Whisper)
  max_calls_per_day: 200  # publishing: metadata LLM calls per day (0 = no limit); over → metadata waits
  max_concurrent: 1    # publishing: parallel metadata LLM calls

select:
  prefilter: true      # skip transcript windows that are clearly intro / sponsor read / outro / almost no speech
  rerank: true         # final pass: the LLM re-scores the best candidates with ±context, then the usual pick
  rerank_pool: 40      # how many top candidates the re-rank pass looks at
  rerank_context_sec: 20.0  # seconds of context shown before/after each candidate

arcs:                  # arc selection engine (stages/arcs.py): complete ideas, judged; changing this never re-selects old jobs
  engine: arcs         # arcs | legacy (the old window → snap → rerank selection)
  profile: auto        # auto | podcast | interview | vlog_challenge | comedy | horror_comedy | gaming
  max_sec: 90          # hard max per clip (Shorts and Reels allow up to 3 min)
  min_quality: 7.0     # weighted rubric score a clip needs — fewer clips, never weak padding
  gate_completeness: 7.0
  gate_standalone: 7.0
  max_garbled: 0.15    # max share of low-confidence (garbled) transcript words in a clip
  judge_pool: 40       # how many candidates the judge scores
  context_sec: 30      # context shown to the judge before/after each candidate
  judge_model: ''      # '' = llm.model; a bigger local model (e.g. qwen2.5:14b) judges better, slower

scoring_weights:
  hook: 0.3
  standalone: 0.25
  emotion: 0.15
  value: 0.2
  controversy: 0.1

reframe:
  layout: auto         # auto | track | split | blur
  sample_fps: 5.0
  smoothing: 0.85      # EMA factor for the crop x-position (higher = smoother)
  deadzone: 0.04       # ignore face moves smaller than this fraction of frame width
  split_min_distance: 0.35  # faces further apart than this (fraction of width) -> split-screen

captions:
  script: roman        # roman (Hinglish in Latin letters) | devanagari
  preset: bold-yellow-pop
  words_per_line: 3
  max_chars_per_line: 18
  font: Montserrat-ExtraBold
  font_size: 82
  text_color: '#FFFFFF'
  highlight_color: '#FFE600'
  keyword_color: '#00FF88'
  outline: 6
  shadow: 3
  position_pct: 0.65   # vertical centre of captions as a fraction of screen height
  hook_title: true
  hook_seconds: 3.0

render:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: veryfast     # veryfast | fast | medium
  loudness_lufs: -14.0
  audio_bitrate: 192k
  use_nvenc: auto      # auto | true | false
  workers: auto

output:
  dir: workspace

publishing:
  mode: assisted       # assisted (you upload in YouTube Studio, ClipForge prepares everything) | api (auto upload)
  api_audited: false   # set true once Google approved your YouTube API compliance audit (raises quota)
  unverified_lock: false  # Google lifted the private-only lock for unverified API projects on 2026-11-02
  contains_synthetic_media: false  # sent as status.containsSyntheticMedia on every YouTube upload (AI disclosure)
  timezone: Asia/Kolkata
  slots: ['12:30', '18:30', '21:00']   # default publish times (IST) for new channels
  peak_slots: ['18:30', '21:00']       # best clips go here, weaker ones to the other slots
  posts_per_day: 6
  min_gap_hours: 2.5   # 18:30 → 21:00 is 2.5 h; a larger gap would drop a default slot
  upload_ahead_days: 0   # api mode: 0 = upload as soon as a clip is scheduled (private + publishAt; YouTube publishes it on time)
  late_policy: next_slot # api mode, slot <15 min away or passed before upload: next_slot | publish_now | ask
  audit_status: not_applied  # YouTube API audit: not_applied | applied | approved | rejected (Settings → Publishing)
  audit_applied_on: ''   # date you sent the audit form (YYYY-MM-DD)
  insert_calls_per_day: 100   # videos.insert quota bucket (official default)
  units_per_day: 10000        # all other YouTube Data API calls
  batch_max: 15        # assisted mode: files per Studio upload batch
  category_id: '27'    # 27 Education, 22 People & Blogs
  language: hi
  sync_every_hours: 12.0 # how often stats are pulled while the app runs

youtube:               # Publishing v2: upload eligibility per channel (Google doesn't expose "uploads left")
  daily_safety_limit: 8   # successful uploads per rolling 24 h per channel (YouTube refused after ~10 on 5 Nov)
  min_gap_sec: 120        # between two uploads of one channel
  max_per_batch: 2        # uploads per scheduler run per channel
  cooldown_hours: 24      # after uploadLimitExceeded, counted from the first upload of the current 24-h window
  project_units_safe_pct: 90  # stop uploads above this % of the daily API units
  override_until: ''      # ISO time (e.g. 2026-11-06T12:00): ignore cooldown + safety limit until then

schedule:              # Publishing v2: daily plan per platform, IST (slots before day_cutoff belong to the evening before)
  enabled: true        # false = the old per-channel slot lists (publishing.slots / instagram.slots)
  auto_adapt: true     # weekly: move slots ±30–60 min toward better 24-h views (after adapt_min_posts posts)
  day_cutoff: '05:00'
  ig_morning: ['08:00', '09:30', '11:00']
  ig_evening: ['18:00', '19:30', '21:00', '22:15', '23:30', '00:45']
  ig_min_per_day: 8    # smart: the floor; fixed lists: up to ig_max_per_day when approved clips cover today + 1 day
  ig_max_per_day: 10   # smart: the normal count per day
  ig_min_gap_minutes: 60
  yt_slots: ['12:30', '15:00', '18:30', '20:30', '22:00']  # 5/day; 6/day adds yt_sixth_slot when views are rising
  yt_sixth_slot: '23:30'
  adapt_min_posts: 20
  smart: true         # times + posts/day learned from your own posts (publish/smart.py); false = the fixed lists above
  smart_window: ['07:00', '01:30']     # Instagram: earliest / latest slot (IST)
  smart_window_yt: ['07:00', '01:00']  # YouTube
  yt_min_per_day: 6    # smart: fewer only when the last 5 Shorts clearly underperform the 10 before
  yt_max_per_day: 8    # smart: also capped by youtube.daily_safety_limit
  yt_min_gap_minutes: 75

ypp:                   # YouTube Partner Program targets — edit if YouTube changes them
  ad_subs: 1000
  ad_shorts_views_90d: 10000000
  fan_subs: 500
  fan_shorts_views_90d: 3000000
  fan_uploads_90d: 3
  new_rule_date: '2027-02-01'
  new_ad_shorts_views_90d: 20000000

instagram:             # Instagram Reels (Phase 13) — account + Meta app on the Accounts / Settings pages
  mode: api            # api (ClipForge publishes at the slot; laptop must be on) | assisted (you post; ClipForge makes a kit)
  graph_version: v26.0 # Meta Graph API version
  slots: ['13:00', '19:00', '21:30']   # default IST post times for new Instagram accounts
  peak_slots: ['19:00', '21:30']
  posts_per_day: 3
  min_gap_hours: 2.0
  upload_lead_minutes: 20   # upload the video this many minutes before the slot, publish exactly at the slot
  max_late_minutes: 90      # if the laptop was off longer than this past the slot → "missed" (never posted late)
  publish_limit: 100        # Instagram: API-published posts per moving 24 h
  publish_limit_margin: 10  # stay this far below the limit
  hours_after_youtube: 0.0  # "both" platforms: Instagram at least this many hours after the YouTube slot
  share_to_feed: true       # show the Reel in the main feed too
  test_account_id: ''       # IG user id that may receive ONE live test Reel (empty = live tests never publish)
  public_url: ''            # https base Meta sends remote logins back to (empty = auto: https://<laptop>.<tailnet>.ts.net)
  test_publish_ok: false    # `clipforge ig-test`: true = also publish the test Reel (it goes LIVE on the profile)
  profile_guard: true       # before each upload: skip a clip already on the profile (same video, e.g. posted by hand)

reach:                 # YouTube reach report (REACH_REPORT.md) + the rules it led to — future clips only
  weekly_report: true  # every 7 days: workspace/reports/REACH_REPORT.md + a Telegram summary
  min_hours: 48        # a Short younger than this is "too new" to judge
  min_views: 50        # < this many views (and < min_feed_views Shorts-feed views) after min_hours = "no test traffic"
  min_feed_views: 20
  min_view_pct: 70.0   # average view % below this = "tested but rejected"
  hook_rule: true      # selection prompt: stricter first-sentence rule (half the viewers leave in the first seconds)
  title_rules: true    # title prompt: guest name + search words (search is the #1 traffic source)

auth:                  # login when used from your phone (Phase 14); password hash lives in .env
  trust_localhost: true  # no password needed on the laptop itself (127.0.0.1)
  session_days: 30     # "remember this device"
  max_failures: 5      # wrong passwords before a lockout
  lockout_minutes: 15

power:
  keep_awake: when_busy  # always | when_busy (a job runs or an Instagram post is due within 60 min) | never

telegram:              # bot token lives in .env (TELEGRAM_BOT_TOKEN); pair it in Settings → Phone & Telegram
  enabled: false
  notify_job_done: true
  notify_job_failed: true
  notify_published: true
  notify_publish_failed: true
  notify_reauth: true
  notify_quota: true
  daily_summary: true
  daily_summary_time: '22:00'  # IST
  chat: true           # write normally: the local LLM answers, or runs ONE command (shown, with its usual checks)
  chat_model: ''       # '' = llm.model
  api_base_url: https://api.telegram.org  # self-hosted Bot API server for 2 GB files, e.g. http://127.0.0.1:8081
  clips_to_send: 5     # clip cards sent when a job finishes (thumbnail album + one card per clip)
  progress_every_sec: 8  # live job progress message: edited at most this often
  pin_required: false  # ask a PIN (clipforge telegram set-pin) before publish now / make public / delete / unpause
  commands_per_minute: 30  # per chat; extra commands are ignored
  mini_app: false      # "Open app" buttons as a Telegram Mini App (needs Tailscale HTTPS; see docs/TELEGRAM.md)

remote:
  watch_folder: ''     # `clipforge watch`: start a job for every video dropped in this folder ('' = off)
  preview_proxy: true  # render a small 540×960 preview per clip for phones / data saver

deployment:            # Phase 15b — where things run (see AUTOMATION_GUIDE Part I)
  mode: standalone     # standalone (everything here, default) | server (always-on box: DB, tokens, publishing, Telegram) | worker (laptop: heavy jobs only)
  node_name: ''        # shown in Telegram ("on laptop"); '' = computer name
  server_url: ''       # worker: the server over Tailscale, e.g. http://clipforge-server:8000
  capabilities: [download, transcribe, select, render]  # worker: stages this computer accepts
  max_parallel: 1
  prefer_worker_for: [download, transcribe, select, render]  # server: give these to a worker when one is online
  worker_grace_minutes: 10   # server: a stage waits this long for a worker before running it itself
  lease_seconds: 120   # a claimed task goes back to the queue if its worker stops renewing it
  heartbeat_seconds: 30

server:                # Phase 15b housekeeping + backups (server or standalone)
  keep_sources_days: 14          # delete source video/audio of finished jobs after this many days
  keep_clips_days_after_publish: 14  # delete rendered clips this long after all their posts went out
  disk_warn_pct: 80    # Telegram warning
  disk_pause_pct: 90   # new jobs are refused above this
  backup_dir: ''       # '' = workspace/backups
  backup_recipient: '' # age public key (age1…): backups are encrypted to it, the private key stays with you
  backup_keep_daily: 7
  backup_keep_weekly: 4
  backup_time: '03:30' # IST
  rclone_remote: ''    # optional off-site copy, e.g. gdrive-crypt:clipforge (an rclone crypt remote on your Drive)
  download_cookies_file: ''  # optional yt-dlp cookies.txt (server only; use a throwaway Google account)
  download_max_attempts: 3   # YouTube bot-check retries (with backoff) before asking you
