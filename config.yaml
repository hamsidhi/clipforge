# ClipForge configuration. Every value here can also be changed from the web app (Settings page).
# Secrets (GEMINI_API_KEY, GROQ_API_KEY) live in .env, never here.

clips:
  count: 20          # how many clips to output (clamped to min_count..max_count)
  min_count: 15
  max_count: 25
  min_sec: 20
  max_sec: 59
  max_overlap: 0.3   # drop a candidate overlapping a better one by more than this fraction

whisper:
  model: auto          # auto -> large-v3 on CUDA, large-v3-turbo on CPU. Or: small, medium, large-v3, large-v3-turbo
  language: hi         # hi, en, or auto
  compute_type: auto   # auto -> float16 on CUDA, int8 on CPU
  vad: true
  beam_size: auto      # auto -> 5 on GPU, 1 on CPU

llm:
  provider: ollama     # ollama | gemini | groq | mock
  model: auto          # auto -> best installed Ollama model / provider default
  temperature: 0.3
  window_min: 8
  overlap_min: 1
  max_retries: 3
  max_candidates_per_window: 6
  ollama_url: http://127.0.0.1:11434
  timeout_sec: 600
  max_tokens: 2048     # cap per LLM reply (stops runaway generations on slow CPUs)

scoring_weights:
  hook: 0.3
  standalone: 0.25
  emotion: 0.15
  value: 0.2
  controversy: 0.1

reframe:
  layout: auto         # auto | track | split | blur
  sample_fps: 5
  smoothing: 0.85      # EMA factor for the crop x-position (higher = smoother)
  deadzone: 0.04       # ignore face moves smaller than this fraction of frame width
  split_min_distance: 0.35  # faces further apart than this (fraction of width) -> split-screen

captions:
  script: roman        # roman (Hinglish in Latin letters) | devanagari
  preset: bold-yellow-pop
  words_per_line: 3
  max_chars_per_line: 18
  font: Montserrat-ExtraBold
  font_size: 82
  text_color: "#FFFFFF"
  highlight_color: "#FFE600"
  keyword_color: "#00FF88"
  outline: 6
  shadow: 3
  position_pct: 0.65   # vertical centre of captions as a fraction of screen height
  hook_title: true
  hook_seconds: 3

render:
  width: 1080
  height: 1920
  fps: 30
  crf: 20
  preset: veryfast     # veryfast | fast | medium
  loudness_lufs: -14
  audio_bitrate: 192k
  use_nvenc: auto      # auto | true | false
  workers: auto

output:
  dir: workspace

publishing:
  mode: assisted       # assisted (you upload in YouTube Studio, ClipForge prepares everything) | api (auto upload)
  api_audited: false   # set true once Google approved your YouTube API compliance audit (raises quota)
  unverified_lock: false  # Google lifted the private-only lock for unverified API projects on 2026-11-02
  timezone: Asia/Kolkata
  slots: ["12:30", "18:30", "21:00"]   # default publish times (IST) for new channels
  peak_slots: ["18:30", "21:00"]       # best clips go here, weaker ones to the other slots
  posts_per_day: 3
  min_gap_hours: 2.5   # 18:30 → 21:00 is 2.5 h; a larger gap would drop a default slot
  upload_ahead_days: 5   # api mode: upload this many days ahead with publishAt (laptop needn't be on at publish time)
  insert_calls_per_day: 100   # videos.insert quota bucket (official default)
  units_per_day: 10000        # all other YouTube Data API calls
  batch_max: 15        # assisted mode: files per Studio upload batch
  category_id: "27"    # 27 Education, 22 People & Blogs
  language: hi
  sync_every_hours: 12 # how often stats are pulled while the app runs

ypp:                   # YouTube Partner Program targets — edit if YouTube changes them
  ad_subs: 1000
  ad_shorts_views_90d: 10000000
  fan_subs: 500
  fan_shorts_views_90d: 3000000
  fan_uploads_90d: 3
  new_rule_date: "2027-02-01"
  new_ad_shorts_views_90d: 20000000
